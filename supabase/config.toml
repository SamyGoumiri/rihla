# Configuration locale Supabase CLI pour Rihla.
# Ce fichier est utilisé par `supabase start` (émulateur local) et
# `supabase db push` (pour ordonner l'application des migrations).
# Les valeurs sensibles (URL projet, clés) restent hors du repo.

project_id = "rihla-pfe"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "rihla://auth-callback"
additional_redirect_urls = ["rihla://auth-callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
